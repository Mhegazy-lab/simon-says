<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="application-name" content="Simon Says" />
<meta name="description" content="Watch the lights, repeat the sequence." />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Simon Says</title>
<style>
  :root{--acc:#F472B6; --bg:#0d0612; --ink:#ffeef7; --muted:#8a6a7d;}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #1d0b18 0%, var(--bg) 65%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100dvh;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none;
  }
  .app{width:min(480px,100vw - 24px); height:100dvh; max-height:780px; display:flex; flex-direction:column; padding:16px 14px 12px}
  header{flex:0 0 auto; text-align:center}
  h1{font-size:19px; letter-spacing:.16em; color:var(--acc); text-shadow:0 0 18px rgba(244,114,182,.6)}
  .meta{display:flex; justify-content:center; gap:14px; margin-top:6px}
  .pill{font-size:13px; font-weight:800; letter-spacing:.12em; color:var(--ink); border:1px solid rgba(244,114,182,.35); border-radius:999px; padding:5px 14px; background:rgba(244,114,182,.07)}
  .pill b{color:var(--acc)}
  #status{flex:0 0 auto; text-align:center; font-size:15px; font-weight:800; letter-spacing:.22em; margin:10px 0 6px; min-height:22px; color:var(--acc)}
  #pads{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; margin-bottom:10px}
  .pad{
    border:none; border-radius:26px; cursor:pointer; position:relative;
    background:var(--c); opacity:.32; filter:saturate(.7);
    transition:opacity .12s, filter .12s, box-shadow .12s, transform .08s;
  }
  .pad.lit{opacity:1; filter:saturate(1.3); box-shadow:0 0 34px var(--c), inset 0 0 30px rgba(255,255,255,.35); transform:scale(1.02)}
  .pad:active{transform:scale(.97)}
  .hidden{display:none !important}
  .btn{
    flex:0 0 auto; width:100%; border:none; border-radius:18px; padding:20px;
    font-size:20px; font-weight:900; letter-spacing:.16em; cursor:pointer;
    background:linear-gradient(160deg,#F472B6,#9d2a63); color:#1c0712;
    box-shadow:0 0 26px rgba(244,114,182,.45);
  }
  .btn:active{transform:scale(.97)}
  #overPanel{flex:0 0 auto; text-align:center; border:1px solid rgba(244,114,182,.4); border-radius:18px; padding:16px 12px; background:rgba(244,114,182,.06)}
  #overPanel .t{font-size:24px; font-weight:900; letter-spacing:.18em; color:var(--acc); text-shadow:0 0 20px rgba(244,114,182,.7)}
  #overPanel .r{font-size:15px; margin:8px 0 14px; letter-spacing:.1em; color:var(--ink)}
  #overPanel .r b{color:var(--acc); font-size:20px}
  button:focus-visible{outline:3px solid var(--acc); outline-offset:2px}
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>◆ SIMON SAYS ◆</h1>
      <div class="meta">
        <div class="pill">ROUND <b id="roundNum">–</b></div>
        <div class="pill">BEST <b id="bestNum">0</b></div>
      </div>
    </header>
    <div id="status">PRESS START</div>
    <div id="pads"></div>
    <button id="startBtn" class="btn" data-focusable>▶ START</button>
    <div id="overPanel" class="hidden">
      <div class="t">GAME OVER</div>
      <div class="r">YOU REACHED ROUND <b id="finalRound">0</b></div>
      <button id="againBtn" class="btn" data-focusable>↻ PLAY AGAIN</button>
    </div>
  </main>
<script>
(function(){
'use strict';
var ACC='#F472B6';
var PADS=[
  {c:'#22c55e', f:415.30},
  {c:'#ef4444', f:310.00},
  {c:'#eab308', f:252.00},
  {c:'#3b82f6', f:209.00}
];
var state='idle'; // idle | watch | repeat | over
var seq=[], progress=0, watchTimers=[];
function $(id){return document.getElementById(id);}
/* ---------- audio ---------- */
var AC=null;
function beep(freq,ms){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.5,AC.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(ms/1000));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(ms/1000)+0.02);
  }catch(e){}
}
/* ---------- storage ---------- */
function loadBest(){try{var s=JSON.parse(localStorage.getItem('simon-says-v1'));return (s&&s.best)||0;}catch(e){return 0;}}
function saveBest(b){try{localStorage.setItem('simon-says-v1',JSON.stringify({best:b}));}catch(e){}}
var best=loadBest();
/* ---------- pure logic (test hooks) ---------- */
function nextSequence(s){var n=s.slice(); n.push(Math.floor(Math.random()*4)); return n;}
function pressOk(s,i,p){return s[i]===p;}
if(typeof window!=='undefined'){window.__logic={nextSequence:nextSequence,pressOk:pressOk};}
/* ---------- ui ---------- */
var padBtns=[];
function buildPads(){
  var g=$('pads');
  for(var i=0;i<4;i++){
    var b=document.createElement('button');
    b.className='pad'; b.setAttribute('data-focusable',''); b.setAttribute('aria-label','Pad '+(i+1));
    b.style.setProperty('--c',PADS[i].c);
    (function(ix,btn){btn.addEventListener('click',function(){pressPad(ix);});})(i,b);
    g.appendChild(b); padBtns.push(b);
  }
}
function setStatus(t){$('status').textContent=t;}
function updateMeta(){$('roundNum').textContent=seq.length>0?seq.length:'–'; $('bestNum').textContent=best;}
function flash(i,ms){
  var b=padBtns[i]; if(!b)return;
  b.classList.add('lit'); beep(PADS[i].f,ms);
  setTimeout(function(){b.classList.remove('lit');},ms);
}
function clearWatch(){for(var i=0;i<watchTimers.length;i++)clearTimeout(watchTimers[i]); watchTimers=[];}
function startGame(){
  clearWatch(); seq=[]; progress=0; state='watch';
  $('startBtn').classList.add('hidden'); $('overPanel').classList.add('hidden');
  updateMeta(); nextRound();
}
function nextRound(){
  seq=nextSequence(seq); progress=0; updateMeta();
  state='watch'; setStatus('◉ WATCH ◉');
  var step=600, gap=750;
  for(var i=0;i<seq.length;i++){
    (function(ix){
      watchTimers.push(setTimeout(function(){flash(seq[ix],380);}, 500+ix*gap));
    })(i);
  }
  watchTimers.push(setTimeout(function(){
    state='repeat'; progress=0; setStatus('▶ YOUR TURN');
    padBtns[0].focus();
  }, 500+seq.length*gap+200));
}
function pressPad(i){
  if(state!=='repeat')return;
  flash(i,220);
  if(pressOk(seq,progress,i)){
    progress++;
    if(progress>=seq.length){
      state='watch'; setStatus('✓ NICE!');
      watchTimers.push(setTimeout(nextRound,900));
    }
  }else{
    gameOver();
  }
}
function gameOver(){
  clearWatch(); state='over';
  beep(110,450);
  var reached=seq.length;
  if(reached>best){best=reached; saveBest(best);}
  updateMeta();
  setStatus('✕ WRONG PAD');
  $('finalRound').textContent=reached;
  $('overPanel').classList.remove('hidden');
  $('againBtn').focus();
}
/* ---------- keyboard ---------- */
function movePadFocus(k){
  var cur=padBtns.indexOf(document.activeElement); if(cur<0)cur=0;
  var r=Math.floor(cur/2), c=cur%2;
  if(k==='ArrowUp'||k==='ArrowDown')r=(r+1)%2;
  if(k==='ArrowLeft'||k==='ArrowRight')c=(c+1)%2;
  padBtns[r*2+c].focus();
}
function menuNav(k){
  var f=Array.prototype.slice.call(document.querySelectorAll('[data-focusable]'))
    .filter(function(el){return el.offsetParent!==null&&!el.disabled;});
  if(!f.length)return;
  var i=f.indexOf(document.activeElement);
  var d=(k==='ArrowRight'||k==='ArrowDown')?1:-1;
  f[(i+d+f.length)%f.length].focus();
}
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'||k===' '){e.preventDefault();}
  if(state==='repeat'&&k.indexOf('Arrow')===0){movePadFocus(k);return;}
  var ae=document.activeElement;
  if((k==='Enter'||k===' ')&&ae&&ae.tagName==='BUTTON'){e.preventDefault(); ae.click();return;}
  if(k.indexOf('Arrow')===0){menuNav(k);}
});
/* ---------- init ---------- */
buildPads(); updateMeta();
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
$('startBtn').focus();
})();
</script>
</body>
</html>
